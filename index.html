<!DOCTYPE html>
<html>
<head>
    <title>Random Forest - Healthcare Diagnostics</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f7fa;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 20px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 80%;
            padding: 8px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h2>Healthcare Diagnostics - Random Forest</h2>

    <div class="container">
        <input type="number" id="glucose" placeholder="Enter Glucose Level"><br>
        <input type="number" id="bmi" placeholder="Enter BMI"><br>
        <input type="number" id="age" placeholder="Enter Age"><br>

        <button onclick="predict()">Predict</button>

        <div id="result"></div>
    </div>

<script>

function tree1(glucose, bmi, age) {
    if (glucose > 140) return "High";
    else return "Low";
}

function tree2(glucose, bmi, age) {
    if (bmi > 30) return "High";
    else return "Low";
}

function tree3(glucose, bmi, age) {
    if (age > 45 && glucose > 120) return "High";
    else return "Low";
}

function predict() {
    let glucose = parseInt(document.getElementById("glucose").value);
    let bmi = parseFloat(document.getElementById("bmi").value);
    let age = parseInt(document.getElementById("age").value);

    let votes = [];

    votes.push(tree1(glucose, bmi, age));
    votes.push(tree2(glucose, bmi, age));
    votes.push(tree3(glucose, bmi, age));

    let highCount = votes.filter(v => v === "High").length;
    let lowCount = votes.filter(v => v === "Low").length;

    let finalPrediction = highCount > lowCount ? "High Diabetes Risk" : "Low Diabetes Risk";

    document.getElementById("result").innerHTML =
        "Tree Votes: " + votes.join(", ") + "<br><br>Final Prediction: " + finalPrediction;
}

</script>

</body>
</html>
